<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Year of Systems</title>
<!-- viewport-fit=cover + env(safe-area-inset-*) in the CSS is what stops the iPhone
     home-screen app from putting the nav bar under the home indicator. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Systems">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div id="offline" class="offline" hidden>Offline — showing last synced copy</div>

<main id="view" class="view"><div class="boot">Loading…</div></main>

<nav class="tabbar">
  <button class="tab" data-view="now"     type="button"><span class="ico">◉</span>Now</button>
  <button class="tab" data-view="year"    type="button"><span class="ico">▦</span>Year</button>
  <button class="tab" data-view="library" type="button"><span class="ico">☰</span>Library</button>
  <button class="tab" data-view="settings" type="button"><span class="ico">⚙</span>Settings</button>
</nav>

<script src="/app.js"></script>
</body>
</html>
